<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>中药柜抓药：戥子称重模拟</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1208;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #d4a574;
      font-size: 24px;
      pointer-events: none;
    }
    #schedule-link {
      position: absolute;
      right: 12px;
      bottom: 10px;
      color: #8a6f4a;
      font-size: 12px;
      text-decoration: none;
      z-index: 10;
    }
    #schedule-link:hover { color: #d4a574; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>
  <div id="loading">正在准备药房...</div>
  <a id="schedule-link" href="./schedule.html">代煎排期 →</a>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
